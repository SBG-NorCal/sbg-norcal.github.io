# =========================================================================
# Weekly class schedule. Rendered as a Mon-Sun grid on /schedule/.
#
# THIS FILE IS THE SOURCE OF TRUTH for the class schedule. Edit it directly.
#
# Each entry:
#   day:     Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday
#   start:   24-hr "HH:MM"   <-- 24-HOUR. 6:30 PM is "18:30", NOT "06:30".
#   end:     24-hr "HH:MM"
#   program: slug from _programs (must match)
#   level:   short label shown under the program name on the grid.
#            We use the gym's real class name here (Explorers, Teen/Tween,
#            Leadership, Kettlebell 101/201, ...).
#
# ⚠️ Times are 24-HOUR. Writing "06:30" for a 6:30 pm class is how the
# schedule once ended up with phantom duplicate morning classes.
# Run `python tests/crosscheck_schedule.py` after editing — it catches
# AM/PM mix-ups, duplicates, and bad program slugs.
#
# Coaches are deliberately NOT listed per class — who covers a given slot
# changes week to week. The "Who you'll train with" list on each program
# page comes from the `programs:` field in _coaches/<slug>.md instead.
#
# Standard class lengths (useful sanity check when editing):
#   Foundations / Integrations ....... 75 min
#   Explorers / Teen/Tween ........... 60 min
#   Kettlebell / Starting Strength ... 60 min
#   Boxing Boot Camp / Women's SD .... 45 min
#   Leadership / Sticky Monkey ....... 30 min
# =========================================================================

note: >-
  Times are shown in 24-hour format. Evening classes Monday–Friday;
  Saturday is a morning/midday block. No Sunday classes.

