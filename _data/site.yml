# Calendar feeds for the Events page
calendars:
  # PUBLIC events — anyone can see. Embed this in /events/ and the homepage.
  google_calendar_url: "https://calendar.google.com/calendar/embed?src=sbgnorcal.news%40gmail.com"
  # iCal feed of the same public calendar (Apple Calendar / Outlook subscribe).
  # Google auto-publishes this when the calendar is marked "Make available to public".
  apple_calendar_ics: "https://calendar.google.com/calendar/ical/sbgnorcal.news%40gmail.com/public/basic.ics"
  # PRIVATE / MEMBERS-ONLY events.
  # Create a second Google Calendar (e.g. "SBG NorCal — Members"), share it
  # with each member by email under "Share with specific people". Members
  # signed into Google with that email will see the events; non-members see
  # an empty calendar. Drop the embed URL here (Settings → "Integrate calendar"
  # → "Public URL to this calendar" — yes that wording, even though it's
  # actually access-controlled when the calendar is private).
  members_calendar_url: "https://calendar.google.com/calendar/embed?src=REPLACE_WITH_MEMBERS_CALENDAR_ID&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0&mode=AGENDA&bgcolor=%230b0b0e&color=%23d22020"
  # Add each member's Google account email under the calendar's "Share with
  # specific people" with permission level "See all event details". Keep
  # this list in sync with your roster — Google enforces access, we just
  # render the iframe.

# Google Form intake — "CB Inquiries ~ SBG NorCal"
# Submissions land in the gym's existing intake spreadsheet.
# Field IDs were extracted from the live form on sbgnorcal.com/get-started.
# To swap to a different form: replace form_id and re-extract the entry IDs.
google_form:
  form_id: "1FAIpQLScmxcWLD-jbaCwMsw0klAzjzY-pIW0QR2Z76HWyOISHS7f9Tw"
  action: "https://docs.google.com/forms/d/e/1FAIpQLScmxcWLD-jbaCwMsw0klAzjzY-pIW0QR2Z76HWyOISHS7f9Tw/formResponse"
  fields:
    name:    "entry.1553348061"
    email:   "entry.847227639"
    phone:   "entry.28741149"
    message: "entry.1922512884"
    program: "entry.1640851804"
  # Map our program slugs to the EXACT option strings Google Forms expects.
  # If a slug isn't listed, falls back to "Brazilian Jiu Jitsu (BJJ)".
  program_options:
    brazilian-jiu-jitsu: "Brazilian Jiu Jitsu (BJJ)"
    mma:                 "Mixed Martial Arts (MMA)"
    kickboxing:          "Kickboxing (KB)"
    boxing-bootcamp:     "Boxing Boot Camp (BBC)"
    fitness-101:         "Fitness"
    youth-martial-arts:  "Youth Jiu Jitsu"
    open-mat:            "Brazilian Jiu Jitsu (BJJ)"
  program_default: "Brazilian Jiu Jitsu (BJJ)"

